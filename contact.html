<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esco Jam Collective</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.svg">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <header>
        <!-- Navigation -->
        <nav class="navbar" data-bs-theme="dark">
            <div class="container nav-panel">

                <a class="navbar-brand" href="index.html">
                    <img
                        src="assets/images/escojamlogo.png"
                        alt="Escojam Collective home"
                        class="navbar-logo"
                    >
                </a>

                <ul class="navbar-nav flex-row flex-wrap gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="#events">Events</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">Gallery</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>

            </div>
        </nav>
    </header>

    <main>
        <!-- Hero image -->
        <section id="herocontact" aria-label="Escojam Collective"></section>

    </main>

    <!-- Footer -->
    <footer id="contact" class="site-footer">
        <div class="container py-5">
            <div class="row g-4">

                <!-- Navigation -->
                <div class="col-12 col-md-3">
                    <nav aria-label="Footer navigation">
                        <ul class="footer-menu">
                            <li><a href="index.html">Home</a></li>
                            <li><a href="#events">Events</a></li>
                            <li><a href="about.html">About</a></li>
                            <li><a href="gallery.html">Gallery</a></li>
                            <li><a href="#contact">Contact</a></li>
                        </ul>
                    </nav>
                </div>

                <!-- Email -->
                <div class="col-12 col-md-5">
                    <a
                        href="mailto:escojamcollective@gmail.com"
                        class="footer-email"
                    >
                        <i class="bi bi-envelope" aria-hidden="true"></i>
                        <span>escojamcollective@gmail.com</span>
                    </a>
                </div>

                <!-- Logo and social links -->
                <div class="col-12 col-md-4 footer-branding">
                    <a href="index.html">
                        <img
                            src="assets/images/escojamlogo.png"
                            alt="Escojam Collective home"
                            class="footer-logo"
                        >
                    </a>

                    <div class="footer-socials">
                        <a
                            href="https://www.instagram.com/escojamcollective/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Instagram (opens in a new tab)"
                        >
                            <i
                                class="bi bi-instagram"
                                aria-hidden="true"
                            ></i>
                        </a>

                        <a
                            href="https://www.tiktok.com/@escojamcollective"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="TikTok (opens in a new tab)"
                        >
                            <i
                                class="bi bi-tiktok"
                                aria-hidden="true"
                            ></i>
                        </a>
                    </div>
                </div>

            </div>

            <p class="footer-copyright mb-0">
                &copy; 2026 Escojam Collective
            </p>
        </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
